      try {
        if (ws) { const r = await ws.get(k); return r ? JSON.parse(r.value) : null; }
        if (ls) { const v = ls.getItem(k); return v ? JSON.parse(v) : null; }
      } catch (e) {}
      return mem[k] !== undefined ? mem[k] : null;
    },
    async set(k, v) {
      mem[k] = v;
      try { if (ws) { await ws.set(k, JSON.stringify(v)); return true; } if (ls) { ls.setItem(k, JSON.stringify(v)); return true; } }
      catch (e) { return false; }
      return true;
    }
  };
})();

/* ══════════════════════════════════════════════════════════
   상태
   ══════════════════════════════════════════════════════════ */
const DB = { banks: {}, gloss: [], notes: [], ver: null, synced: null, demo: true };
let PG = {
  stats: {},   // n -> {seen, ok, no, cyc}   cyc = 마지막으로 푼 회독 번호
  rounds: [],
  extra: {},
  set: { count: 10, cats: [], mode: 'cycle', autoNext: true }
};
let R = null, view = 'home', tick = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(3, '0');
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '').replace(/[.,!?()[\]{}'"`~\-_/\\·:;、，。]/g, '');

function allItems() {
  const real = Object.keys(DB.banks).filter(id => !DB.banks[id].demo);
  const use = real.length ? real : Object.keys(DB.banks);
  const out = [], seen = new Set();
  use.sort().reverse().forEach(id => (DB.banks[id].items || []).forEach(it => {
    if (!seen.has(it.n)) { seen.add(it.n); out.push(it); }
  }));
  return out.sort((a, b) => a.n - b.n);
}
const isDemo = () => !Object.keys(DB.banks).some(id => !DB.banks[id].demo);
function st(n) { const s = PG.stats[n]; return s ? s : { seen: 0, ok: 0, no: 0, cyc: 0 }; }
function wrongNs() {
  return Object.keys(PG.stats).filter(n => PG.stats[n].no > 0).map(Number)
    .sort((a, b) => PG.stats[b].no - PG.stats[a].no || a - b);
}
const tierOf = p => p >= 90 ? 0 : p >= 75 ? 1 : p >= 60 ? 2 : 3;
/* 현재 회독 = 가장 덜 본 문항 기준 */
function curCycle() {
  const its = allItems();
  if (!its.length) return 1;
  return Math.min(...its.map(i => st(i.n).cyc || 0)) + 1;
}
let toastT;
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400);
}
const save = () => S.set('progress', PG);

/* ══════════════════════════════════════════════════════════
   출제 엔진 — 회독 우선
   같은 회독을 안 끝낸 문항이 있으면 그 문항부터 무조건 먼저 나온다.
   ══════════════════════════════════════════════════════════ */
function weight(it) {
  const s = st(it.n);
  if (s.no > 0) return 4 + Math.min(s.no, 5);   // 틀린 이력 → 같은 회독 안에서 우선
  return 1;
}
function sampleW(arr, k) {
  const p = arr.slice(), out = [];
  const w = new Map(p.map(it => [it.n, weight(it)]));
  for (let i = 0; i < k && p.length; i++) {
    let total = 0; p.forEach(it => total += w.get(it.n));
    let r = Math.random() * total, idx = p.length - 1;
    for (let j = 0; j < p.length; j++) { r -= w.get(p[j].n); if (r <= 0) { idx = j; break; } }
    out.push(p.splice(idx, 1)[0]);
  }
  return out;
}
function sampleU(arr, k) {
  const p = arr.slice(), out = [];
  for (let i = 0; i < k && p.length; i++) out.push(p.splice(Math.floor(Math.random() * p.length), 1)[0]);
  return out;
}
/* 회독 계층 : cyc 값이 낮은 묶음을 완전히 소진한 뒤 다음 묶음으로 */
function pickCycle(pool, count) {
  const tiers = {};
  pool.forEach(it => { const c = st(it.n).cyc || 0; (tiers[c] = tiers[c] || []).push(it); });
  const keys = Object.keys(tiers).map(Number).sort((a, b) => a - b);
  const out = [];
  for (const k of keys) {
    if (out.length >= count) break;
    out.push(...sampleW(tiers[k], count - out.length));
  }
  return out;
}
function buildPool() {
  let pool = allItems();
  if (PG.set.mode === 'wrong') {
    const ws = new Set(wrongNs());
    return pool.filter(i => ws.has(i.n));
  }
  if (PG.set.cats.length) pool = pool.filter(i => PG.set.cats.includes(catOf(i)));
  return pool;
}
function startRound(forceList) {
  const mode = forceList ? 'wrong' : PG.set.mode;
  let items;
  if (mode === 'exam') {
    const all = allItems();
    items = [];
    SUBJECTS.forEach(s => {
      const bucket = all.filter(i => catOf(i) === s.id);
      items.push(...sampleU(bucket, s.n));
      if (bucket.length < s.n) items.push(...[]);   // 부족하면 그만큼 적게
    });
    items = sampleU(items, items.length);           // 과목 섞기
    if (!items.length) return toast('문항이 없어');
  } else {
    const pool = forceList || buildPool();
    if (!pool.length) return toast('조건에 맞는 문항이 없어');
    const cnt = PG.set.count === 0 ? pool.length : Math.min(PG.set.count, pool.length);
    items = mode === 'plain' ? sampleU(pool, cnt) : pickCycle(pool, cnt);
  }
  R = { items, idx: 0, ans: {}, t: Date.now(), mode, cyc: curCycle() };
  if (mode === 'exam') R.deadline = Date.now() + EXAM_MIN * 60000;
  go('quiz');
}
function judge(it, v) {
  if (v === undefined || v === null || v === '') return null;
  if (it.type === 'mc' || it.type === 'ox') return v === it.ans;
  const list = (Array.isArray(it.ans) ? it.ans : [it.ans]).concat(PG.extra[it.n] || []);
  return list.some(a => norm(a) === norm(v));
}
function finish() {
  stopTick();
  const C = R.cyc;
  const res = R.items.map(it => ({ it, v: R.ans[it.n], ok: judge(it, R.ans[it.n]) }));
  res.forEach(({ it, ok }) => {
    if (ok === null) return;
    const s = st(it.n);
    PG.stats[it.n] = {
      seen: s.seen + 1, ok: s.ok + (ok ? 1 : 0), no: ok ? s.no : s.no + 1,
      cyc: Math.max(s.cyc || 0, C)
    };
  });
  const done = res.filter(r => r.ok !== null), got = done.filter(r => r.ok).length;
  R.result = { res, got, done: done.length, rate: done.length ? Math.round(got / done.length * 100) : 0 };
  PG.rounds.unshift({ t: Date.now(), score: got, total: done.length, mode: R.mode });
  PG.rounds = PG.rounds.slice(0, 40);
  const after = curCycle();
  save();
  go('result');
  if (after > C) toast(`${C}회독 완료 — ${after}회독 시작`);
}

/* ══════════════════════════════════════════════════════════
   화면
   ══════════════════════════════════════════════════════════ */
function go(v) {
  if (view === 'quiz' && v !== 'quiz') stopTick();
  view = v;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.go === v));
  $('#nav').classList.toggle('hide', v === 'quiz');
  ({ home: rHome, quiz: rQuiz, result: rResult, wrong: rWrong, gloss: rGloss, notes: rNotes, data: rData })[v]();
  window.scrollTo(0, 0);
  const last = PG.rounds[0];
  const lv = last && last.total ? tierOf(Math.round(last.score / last.total * 100)) : null;
  $('#gauge').className = 'gauge' + (lv === null ? '' : ' lv' + lv);
  [...$('#gaugeLbl').children].forEach((s, i) => s.classList.toggle('on', i === lv));
  $('#eyebrow').textContent = allItems().length ? `${curCycle()}회독 · ${allItems().length} ITEMS` : 'SEC · ITEM BANK';
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.go));

function rHome() {

    return;
  }
  const C = curCycle();
  const doneThis = items.filter(i => (st(i.n).cyc || 0) >= C).length;

  const byCat = SUBJECTS.map(s => {

  });

  <div class="card">

      <div class="notice" style="margin:12px 0 0">실전 배분 <b>${SUBJECTS.map(s => s.n).join('+')} = 100문항</b> · 제한시간 <b>${EXAM_MIN}분</b>. 시간이 끝나면 자동 채점돼.</div>`
    : PG.set.mode === 'wrong' ? `<p class="muted" style="margin:10px 0 0">오답노트에 담긴 ${wn}문항에서만 출제해.</p>` : `
      <hr><div class="lbl">문항 수</div>

  </div>

      const nm = { cycle: '회독', plain: '랜덤', wrong: '오답', exam: '모의고사' }[r.mode] || '';
      return `<div class="stat"><span class="muted" style="font-size:12.5px">${new Date(r.t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} · ${nm}</span>

    }).join('')}</div>` : ''}`;

  const H = $('#s-home');
  H.querySelectorAll('[data-cnt]').forEach(b => b.onclick = () => { PG.set.count = +b.dataset.cnt; save(); rHome(); });
  H.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { PG.set.mode = b.dataset.mode; save(); rHome(); });
  H.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    const c = +b.dataset.cat, i = PG.set.cats.indexOf(c);
    if (i < 0) PG.set.cats.push(c); else PG.set.cats.splice(i, 1);

/* ── 풀이 ────────────────────────────────────── */
function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
function clockText() {
  const ms = Math.max(0, R.deadline - Date.now());
  const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function startTick() {
  stopTick();
  if (!R || !R.deadline) return;
  tick = setInterval(() => {
    const el = $('#clock');
    if (!el) return;
    const ms = R.deadline - Date.now();
    el.textContent = clockText();
    el.classList.toggle('warn', ms < 5 * 60000);
    if (ms <= 0) { toast('시간 종료 — 자동 채점'); finish(); }
  }, 1000);
}
function rQuiz() {
  if (!R) return go('home');
  const it = R.items[R.idx], v = R.ans[it.n], cid = catOf(it);
  const answered = Object.values(R.ans).filter(x => x !== undefined && x !== '').length;
  let body;
  if (it.type === 'mc') {
    body = (it.opts || []).map((o, i) =>
      `<button class="opt${v === i ? ' on' : ''}" data-pick="${i}"><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`).join('');
  } else if (it.type === 'ox') {
    body = `<div class="oxrow">
      <button class="opt${v === 'O' ? ' on' : ''}" data-pick="O">O</button>
      <button class="opt${v === 'X' ? ' on' : ''}" data-pick="X">X</button></div>`;
  } else {
    body = `${it.fmt ? `<div class="fmt">${esc(it.fmt)}</div>` : ''}
      <input class="saInput" id="sa" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="답을 입력" value="${esc(v || '')}">`;
  }
  $('#s-quiz').innerHTML = `
  <div class="prog">
    <div class="track"><i style="width:${(R.idx + 1) / R.items.length * 100}%"></i></div>
    <span>${R.idx + 1}/${R.items.length}</span>
    ${R.deadline ? `<span id="clock">${clockText()}</span>` : ''}
    <button class="chip sm" id="stop" style="min-height:32px;padding:5px 10px">중단</button>
  </div>
  <div class="card">
    <div class="qhead"><span class="qno">#${pad(it.n)}</span>
      <span class="qcat">${esc(catShort(cid))}${it.sub ? '<br>' + esc(it.sub) : ''}</span></div>
    <p class="qtext">${esc(it.q)}</p>
    ${body}
  </div>
  <p class="muted" style="text-align:center">답한 문항 ${answered} / ${R.items.length}</p>
  <div class="qbar">
    <button id="prev" ${R.idx === 0 ? 'disabled' : ''}>← 이전</button>
    <button id="skip">건너뛰기</button>
    <button class="pri" id="next">${R.idx === R.items.length - 1 ? '채점하기' : '다음 →'}</button>
  </div>`;
  $('#s-quiz').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const p = b.dataset.pick;
    R.ans[it.n] = (p === 'O' || p === 'X') ? p : +p;
    if (PG.set.autoNext) setTimeout(nextQ, 130); else rQuiz();
  });
  const sa = $('#sa');
  if (sa) {
    sa.oninput = () => { R.ans[it.n] = sa.value; };
    sa.onkeydown = e => { if (e.key === 'Enter') { sa.blur(); nextQ(); } };
  }
  $('#stop').onclick = stopRound;
  $('#prev').onclick = () => { if (R.idx > 0) { R.idx--; rQuiz(); } };
  $('#skip').onclick = () => { delete R.ans[it.n]; nextQ(); };
  $('#next').onclick = nextQ;
  if (R.deadline && !tick) startTick();
}
function nextQ() { if (!R) return; if (R.idx < R.items.length - 1) { R.idx++; rQuiz(); } else finish(); }
function stopRound() {
  const n = Object.values(R.ans).filter(x => x !== undefined && x !== '').length;
  if (!n) { if (confirm('답한 문항이 없어. 라운드를 버릴까?')) { stopTick(); R = null; go('home'); } return; }
  if (confirm(`답한 ${n}문항만 채점할까?`)) finish();
}

/* ── 결과 ────────────────────────────────────── */
function rResult() {

    <div style="margin:10px 0 4px"><span class="tier lv${lv}"><b>LEVEL ${lv + 1}</b>${TIERS[lv]}</span></div>
    <p class="muted" style="margin:8px 0 0">${got} / ${done} 정답${skipped ? ` · 미응답 ${skipped}문항 제외` : ''}</p>
  </div>
  ${Object.keys(byCat).length > 1 ? `<div class="card"><h2>과목별</h2>
    ${Object.entries(byCat).sort((a, b) => a[0] - b[0]).map(([c, b]) =>
      `<div class="stat"><span>${esc(catShort(+c))}</span><b>${b.ok}/${b.n}</b></div>`).join('')}</div>` : ''}
  <div class="card"><h2>문항별 결과 <span class="muted" style="font-weight:400">· 눌러서 해설</span></h2>
    ${res.map(rItemRow).join('')}</div>
  <div class="qbar">
    <button onclick="R=null;go('home')">홈</button>
    <button class="pri" onclick="startRound()">한 번 더</button>
  </div>`;
  $('#s-result').querySelectorAll('[data-accept]').forEach(b => b.onclick = () => {
    const n = +b.dataset.accept, row = R.result.res.find(r => r.it.n === n);
    if (!row || !row.v) return;
    PG.extra[n] = (PG.extra[n] || []).concat(row.v);
    row.ok = true;
    const s = st(n);
    PG.stats[n] = { ...s, ok: s.ok + 1, no: Math.max(0, s.no - 1) };
    const done2 = R.result.res.filter(r => r.ok !== null);
    R.result.got = done2.filter(r => r.ok).length;
    R.result.rate = done2.length ? Math.round(R.result.got / done2.length * 100) : 0;
    save(); toast('정답으로 인정했어'); rResult();
  });
}
function rItemRow(r) {
  const it = r.it, m = r.ok === null ? ['sk', '–'] : r.ok ? ['ok', 'O'] : ['no', 'X'];
  const mine = r.v === undefined || r.v === '' ? '<span class="muted">미응답</span>'
    : it.type === 'mc' ? esc(`${r.v + 1}. ${it.opts[r.v]}`) : esc(r.v);
  const correct = it.type === 'mc' ? esc(`${it.ans + 1}. ${it.opts[it.ans]}`)
    : it.type === 'ox' ? esc(it.ans) : esc((Array.isArray(it.ans) ? it.ans : [it.ans]).join(' / '));
  return `<details class="ritem"${r.ok === false ? ' open' : ''}>
    <summary><span class="mark ${m[0]}">${m[1]}</span>
      <span class="qt"><span class="qno">#${pad(it.n)}</span> ${esc(it.q)}</span></summary>
    <div class="ans">
      <div class="a"><i>내 답</i>${mine}</div>
      <div class="a"><i>정답</i><span style="color:var(--ok);font-weight:700">${correct}</span></div>
      ${it.exp ? `<div class="exp">${esc(it.exp)}</div>` : ''}
      ${it.type === 'sa' && r.ok === false && r.v ? `<button class="btn ghost sm" style="margin-top:9px" data-accept="${it.n}">이 답도 정답으로 인정</button>` : ''}
    </div></details>`;
}

/* ── 오답노트 ─────────────────────────────────── */
let wFilter = 0;
function rWrong() {
  const map = new Map(allItems().map(i => [i.n, i]));
  const all = wrongNs().filter(n => map.has(n));
  if (!all.length) {
    $('#s-wrong').innerHTML = `<div class="card">${emptyBox('CLEAR', '오답이 없어',
      '틀린 문항은 여기 자동으로 쌓이고, 다음 회독에서 더 자주 나와.')}</div>`;
    return;
  }
  const cs = [...new Set(all.map(n => catOf(map.get(n))))].sort();
  const ns = wFilter ? all.filter(n => catOf(map.get(n)) === wFilter) : all;
  $('#s-wrong').innerHTML = `
  <div class="card">
    <div class="lbl">오답 ${all.length}문항</div>
    <div class="row" style="gap:6px;margin-bottom:12px">
      <button class="chip sm${!wFilter ? ' on' : ''}" data-wf="0">전체</button>
      ${cs.map(c => `<button class="chip sm${wFilter === c ? ' on' : ''}" data-wf="${c}">${esc(catShort(c))}</button>`).join('')}
    </div>
    <button class="btn" id="drill">이 목록으로 풀기 (${ns.length})</button>
  </div>
  <div class="card">${ns.map(n => {
    const it = map.get(n), s = st(n);
    const correct = it.type === 'mc' ? esc(`${it.ans + 1}. ${it.opts[it.ans]}`)
      : it.type === 'ox' ? esc(it.ans) : esc((Array.isArray(it.ans) ? it.ans : [it.ans]).join(' / '));
    return `<details class="ritem"><summary><span class="mark no">${s.no}</span>
      <span class="qt"><span class="qno">#${pad(n)}</span> ${esc(it.q)}</span></summary>
      <div class="ans">
        <div class="a"><i>정답</i><span style="color:var(--ok);font-weight:700">${correct}</span></div>
        ${it.exp ? `<div class="exp">${esc(it.exp)}</div>` : ''}
        <button class="btn ghost sm" style="margin-top:9px" data-clear="${n}">이 문항 오답에서 빼기</button>
      </div></details>`;
  }).join('')}</div>`;
  $('#s-wrong').querySelectorAll('[data-wf]').forEach(b => b.onclick = () => { wFilter = +b.dataset.wf; rWrong(); });
  $('#s-wrong').querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
    const n = +b.dataset.clear; PG.stats[n] = { ...st(n), no: 0 }; save(); rWrong();
  });
  $('#drill').onclick = () => { const l = ns.map(n => map.get(n)); if (l.length) startRound(l); };
}

/* ── 용어사전 ─────────────────────────────────── */
let gQ = '', gF = '';
function rGloss() {
  if (!DB.gloss.length) {
    $('#s-gloss').innerHTML = `<div class="card">${emptyBox('A–Z', '용어사전이 비어 있어',
      '저장소 <code>data/glossary.json</code>을 올리면 검색 가능한 사전이 여기 들어와.')}</div>`;
    return;
  }
  const cs = [...new Set(DB.gloss.map(t => t.cat || '기타'))];
  $('#s-gloss').innerHTML = `
  <input class="search" id="gq" placeholder="용어 검색 (한글·영문·뜻)" value="${esc(gQ)}" autocomplete="off">
  <div class="row" style="gap:6px;margin-bottom:12px" id="gchips">
    <button class="chip sm${gF === '' ? ' on' : ''}" data-gf="">전체 ${DB.gloss.length}</button>
    ${cs.map(c => `<button class="chip sm${gF === c ? ' on' : ''}" data-gf="${esc(c)}">${esc(c)}</button>`).join('')}
  </div>
  <div class="card" id="glist"></div>`;
  glossList();
  $('#gq').oninput = e => { gQ = e.target.value; glossList(); };
  $('#gchips').querySelectorAll('[data-gf]').forEach(b => b.onclick = () => {
    gF = b.dataset.gf;
    $('#gchips').querySelectorAll('[data-gf]').forEach(x => x.classList.toggle('on', x.dataset.gf === gF));
    glossList();
  });
}
function glossList() {
  let list = DB.gloss.slice();
  if (gF) list = list.filter(t => (t.cat || '기타') === gF);
  if (gQ) {
    const q = norm(gQ);
    list = list.filter(t => norm(t.term).includes(q) || norm(t.en || '').includes(q) || norm(t.def || '').includes(q));
  }
  list.sort((a, b) => String(a.term).localeCompare(String(b.term), 'ko'));
  const el = $('#glist'); if (!el) return;
  el.innerHTML = list.length ? list.map(t => `<div class="term">
      <h3>${esc(t.term)}</h3>${t.en ? `<div class="en">${esc(t.en)}</div>` : ''}
      <p>${esc(t.def || '')}</p>
      ${(t.rel && t.rel.length) ? `<div class="rel">${t.rel.map(r => `<b>${esc(r)}</b>`).join('')}</div>` : ''}
    </div>`).join('') : '<p class="muted" style="text-align:center;padding:20px 0">검색 결과가 없어</p>';
}

/* ── 개념정리 ─────────────────────────────────── */
function md(s) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
  let out = '', ul = false;
  String(s || '').split('\n').forEach(l => {
    const t = l.trim();
    if (/^##\s/.test(t)) { if (ul) { out += '</ul>'; ul = false; } out += `<h4>${inline(t.replace(/^##\s*/, ''))}</h4>`; }
    else if (/^[-*]\s/.test(t)) { if (!ul) { out += '<ul>'; ul = true; } out += `<li>${inline(t.replace(/^[-*]\s*/, ''))}</li>`; }
    else if (!t) { if (ul) { out += '</ul>'; ul = false; } }
    else { if (ul) { out += '</ul>'; ul = false; } out += `<p style="margin:6px 0">${inline(t)}</p>`; }
  });
  return ul ? out + '</ul>' : out;
}
function rNotes() {
  if (!DB.notes.length) {
    $('#s-notes').innerHTML = `<div class="card">${emptyBox('≡', '개념정리가 비어 있어',
      '저장소 <code>data/notes.json</code>을 올리면 과목별 정리본이 여기 들어와.')}</div>`;
    return;
  }
  const g = {};
  DB.notes.forEach(n => { const k = catOf(n) || 0; (g[k] = g[k] || []).push(n); });
  $('#s-notes').innerHTML = Object.keys(g).map(Number).sort((a, b) => a - b).map(k => `
    <div class="lbl" style="margin:14px 0 8px">${esc(k ? catName(k) : '기타')}</div>
    ${g[k].map(n => `<details class="acc"><summary>${esc(n.title)}</summary>
      <div class="body">${md(n.body)}</div></details>`).join('')}`).join('');
}

/* ── 정보 (읽기 전용) ─────────────────────────── */
function emptyBox(ico, h, p) { return `<div class="empty"><div class="ico">${ico}</div><h3>${h}</h3><p>${p}</p></div>`; }
function rData() {
  const items = allItems();
  $('#s-data').innerHTML = `
  <div class="card">
    <h2>콘텐츠</h2>
    <div class="stat"><span>버전</span><b>${esc(DB.ver || '—')}</b></div>
    <div class="stat"><span>마지막 동기화</span><b style="font-size:12.5px">${DB.synced ? new Date(DB.synced).toLocaleString('ko-KR') : '없음'}</b></div>
    <div class="stat"><span>문항</span><b>${items.length}${isDemo() ? ' (데모)' : ''}</b></div>
    <div class="stat"><span>용어</span><b>${DB.gloss.length}</b></div>
    <div class="stat"><span>개념 문서</span><b>${DB.notes.length}</b></div>
    <hr>
    ${SUBJECTS.map(s => `<div class="stat"><span>${s.id}. ${esc(s.short)}</span><b>${items.filter(i => catOf(i) === s.id).length}</b></div>`).join('')}
    <div style="margin-top:14px"><button class="btn ghost sm" id="sync">콘텐츠 새로 받기</button></div>
    <p class="muted" style="margin:10px 0 0">문항·용어·개념은 저장소 <code>data/</code> 폴더가 원본이야. 앱에서는 수정할 수 없고, 파일이 갱신되면 두 사람 모두 같은 내용을 받게 돼.</p>
  </div>
  <div class="card">
    <h2>내 학습 기록</h2>
    <div class="stat"><span>저장 위치</span><b>이 기기 (${S.mode})</b></div>
    <div class="stat"><span>회독</span><b>${items.length ? curCycle() : '—'}</b></div>
    <div class="stat"><span>푼 라운드</span><b>${PG.rounds.length}</b></div>
    <div class="stat"><span>오답</span><b>${wrongNs().length}</b></div>
    <p class="muted" style="margin:12px 0">기록은 기기 안에만 있어서 두 사람의 진도가 섞이지 않아. 대신 브라우저 데이터를 지우면 사라지니 가끔 내보내둬.</p>
    <button class="btn ghost sm" id="exp" style="margin-bottom:8px">학습 기록 내보내기</button>
    <button class="btn danger sm" id="rst">학습 기록 초기화</button>
  </div>`;
  $('#sync').onclick = async () => { toast('받는 중…'); await sync(true); rData(); };
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), ver: DB.ver, progress: PG }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `학습기록-${new Date().toISOString().slice(0, 10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('#rst').onclick = async () => {
    if (!confirm('회독·오답노트·기록이 모두 지워져. 진행할까?')) return;
    PG = { stats: {}, rounds: [], extra: {}, set: PG.set };
    await save(); toast('초기화했어'); rData();
  };
}

/* ══════════════════════════════════════════════════════════
   콘텐츠 동기화 — data/index.json 이 단일 원본
   ══════════════════════════════════════════════════════════ */
async function sync(force) {
  let idx;
  try {
    const r = await fetch('data/index.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw 0;
    idx = await r.json();
  } catch (e) { if (force) toast('저장소에 연결할 수 없어'); return false; }

  const ver = String(idx.ver || '0');
  if (!force && ver === DB.ver) return false;

  const banks = {}, gloss = [], notes = [];
  let fail = 0;
  for (const f of (idx.files || [])) {
    try {
      const d = await (await fetch('data/' + f + '?t=' + Date.now(), { cache: 'no-store' })).json();
      if (d.type === 'glossary') gloss.push(...(d.items || []));
      else if (d.type === 'notes') notes.push(...(d.items || []));
      else if (d.items) {
        const id = String(d.id || f.replace(/\.json$/, ''));
        banks[id] = { id, title: d.title || id, items: d.items, demo: !!d.demo };
      }
    } catch (e) { fail++; }
  }
  if (!Object.keys(banks).length && !gloss.length && !notes.length) {
    if (force) toast('받을 콘텐츠가 없어');
    return false;
  }
  DB.banks = banks; DB.gloss = gloss; DB.notes = notes;
  DB.ver = ver; DB.synced = Date.now();
  await S.set('content', { banks, gloss, notes, ver, synced: DB.synced });
  toast(`콘텐츠 v${ver} 적용 · 문항 ${allItems().length}개${fail ? ` (파일 ${fail}개 실패)` : ''}`);
  return true;
}

async function boot() {
  const p = await S.get('progress');
  if (p) PG = Object.assign(PG, p, { set: Object.assign(PG.set, p.set || {}) });
  const c = await S.get('content');
  if (c && c.banks) { DB.banks = c.banks; DB.gloss = c.gloss || []; DB.notes = c.notes || []; DB.ver = c.ver; DB.synced = c.synced; }
  if (!Object.keys(DB.banks).length) DB.banks = { demo: DEMO };   // 오프라인 첫 실행 대비
  go('home');
  if (await sync(false)) go(view);
  if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
window.addEventListener('keydown', e => { if (e.key === 'Escape' && view === 'quiz') stopRound(); });
boot();
</script>
